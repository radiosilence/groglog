name: GrogLog
options:
  bundleIdPrefix: cc.blit
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift
    from: 7.11.1
  GRDBQuery:
    url: https://github.com/groue/GRDBQuery
    from: 0.11.0
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 2256Q92VF2
    "CODE_SIGN_IDENTITY[sdk=iphonesimulator*]": "-"
targets:
  GrogLog:
    type: application
    platform: iOS
    sources: [GrogLog]
    dependencies:
      - package: GRDB
      - package: GRDBQuery
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cc.blit.groglog
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: GrogLog
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  GrogLogTests:
    type: bundle.unit-test
    platform: iOS
    sources: [GrogLogTests]
    dependencies:
      - target: GrogLog
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  GrogLog:
    build:
      targets:
        GrogLog: all
    test:
      targets: [GrogLogTests]
