name: GrogLog
options:
  bundleIdPrefix: cc.blit
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift
    from: 7.11.1
  GRDBQuery:
    url: https://github.com/groue/GRDBQuery
    from: 0.11.0
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 2256Q92VF2
    "CODE_SIGN_IDENTITY[sdk=iphonesimulator*]": "-"
targets:
  GrogLog:
    type: application
    platform: iOS
    sources: [GrogLog]
    dependencies:
      - package: GRDB
      - package: GRDBQuery
      - target: GrogLogWidgets
    entitlements:
      path: GrogLog/GrogLog.entitlements
      properties:
        com.apple.security.application-groups: [group.cc.blit.groglog]
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    settings:
      base:
        INFOPLIST_KEY_NSHealthUpdateUsageDescription: GrogLog copies what you log into Health, so other apps can read it.
        INFOPLIST_KEY_NSHealthShareUsageDescription: GrogLog reads your sleep, heart rate and HRV to chart them against what you drank the night before.
        PRODUCT_BUNDLE_IDENTIFIER: cc.blit.groglog
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: GrogLog
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  # The widget is a separate process, so it compiles the model layer in rather than sharing the app's.
  GrogLogWidgets:
    type: app-extension
    platform: iOS
    sources:
      - GrogLogWidgets
      - GrogLog/Model
      - GrogLog/Export
      - GrogLog/Intents
      - GrogLog/Views/Shared/Theme.swift
    dependencies:
      - package: GRDB
      - package: GRDBQuery
    entitlements:
      path: GrogLogWidgets/GrogLogWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.cc.blit.groglog]
    info:
      path: GrogLogWidgets/Info.plist
      properties:
        # An extension whose version drifts from its app's is refused at install.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cc.blit.groglog.widgets
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_CFBundleDisplayName: GrogLog
        SKIP_INSTALL: YES
  GrogLogTests:
    type: bundle.unit-test
    platform: iOS
    sources: [GrogLogTests]
    dependencies:
      - target: GrogLog
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  GrogLog:
    build:
      targets:
        GrogLog: all
    test:
      targets: [GrogLogTests]
  # Running this one puts the simulator straight into a widget preview, which is the only sane way to look at one.
  GrogLogWidgets:
    build:
      targets:
        GrogLogWidgets: all
    run:
      askForAppToLaunch: true
      launchAutomaticallySubstyle: 2
