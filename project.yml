name: GrogLog
options:
  bundleIdPrefix: cc.blit
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift
    from: 7.11.1
  GRDBQuery:
    url: https://github.com/groue/GRDBQuery
    from: 0.11.0
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 2256Q92VF2
    "CODE_SIGN_IDENTITY[sdk=iphonesimulator*]": "-"
targets:
  GrogLog:
    type: application
    platform: iOS
    sources: [GrogLog]
    dependencies:
      - package: GRDB
      - package: GRDBQuery
      - target: GrogLogWidgets
    entitlements:
      path: GrogLog/GrogLog.entitlements
      properties:
        com.apple.security.application-groups: [group.cc.blit.groglog]
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        com.apple.developer.icloud-container-identifiers: [iCloud.cc.blit.groglog]
        com.apple.developer.icloud-services: [CloudKit]
        # Settings that belong to the log (goal, currency, when the day ends) sync through the key-value store.
        com.apple.developer.ubiquity-kvstore-identifier: $(TeamIdentifierPrefix)$(CFBundleIdentifier)
        # Changes from another device arrive as silent pushes. Export for the App Store switches this to production.
        aps-environment: development
    settings:
      base:
        INFOPLIST_KEY_UIBackgroundModes: remote-notification
        INFOPLIST_KEY_NSHealthUpdateUsageDescription: GrogLog copies what you log into Health, so other apps can read it.
        # Only the system's own encryption (HTTPS, the keychain), which is exempt; saying so here stops every
        # upload asking.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: "NO"
        INFOPLIST_KEY_NSHumanReadableCopyright: © 2026 James Cleveland
        INFOPLIST_KEY_NSHealthShareUsageDescription: GrogLog reads your sleep, heart rate and HRV to chart them against what you drank the night before.
        PRODUCT_BUNDLE_IDENTIFIER: cc.blit.groglog
        MARKETING_VERSION: 1.1.1
        CURRENT_PROJECT_VERSION: 1
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: GrogLog
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  # The widget is a separate process, so it compiles the model layer in rather than sharing the app's.
  GrogLogWidgets:
    type: app-extension
    platform: iOS
    sources:
      - GrogLogWidgets
      - GrogLog/Model
      - GrogLog/Export
      - GrogLog/Intents
      - GrogLog/Views/Shared/Theme.swift
    dependencies:
      - package: GRDB
      - package: GRDBQuery
    entitlements:
      path: GrogLogWidgets/GrogLogWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.cc.blit.groglog]
    info:
      path: GrogLogWidgets/Info.plist
      properties:
        # An extension whose version drifts from its app's is refused at install.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # App Store Connect refuses an extension without one. The build setting of the same name is ignored here,
        # because this plist is written out rather than generated by Xcode.
        CFBundleDisplayName: GrogLog
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cc.blit.groglog.widgets
        MARKETING_VERSION: 1.1.1
        CURRENT_PROJECT_VERSION: 1
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
  GrogLogTests:
    type: bundle.unit-test
    platform: iOS
    sources: [GrogLogTests]
    dependencies:
      - target: GrogLog
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  GrogLog:
    build:
      targets:
        GrogLog: all
    test:
      targets: [GrogLogTests]
  # Running this scheme opens the simulator in a widget preview, the only practical way to view a widget.
  GrogLogWidgets:
    build:
      targets:
        GrogLogWidgets: all
    run:
      askForAppToLaunch: true
      launchAutomaticallySubstyle: 2
