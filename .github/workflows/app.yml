name: App

# Tests every push and pull request; every push to main is also archived, signed and uploaded to TestFlight. Submitting
# a build for App Store review is left to App Store Connect, where the release notes and screenshots live.

permissions:
  contents: read

on:
  push:
    branches: [main]
    paths-ignore:
      - "site/**"
      - ".github/workflows/site.yml"
      - "docs/**"
      - "**.md"
  pull_request:

concurrency:
  group: app-${{ github.ref }}
  # A newer push supersedes a TestFlight upload that hasn't finished; on a PR it only saves runner time.
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install toolchain
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3

      - name: Use the newest Xcode on the runner
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"

      - name: Test
        run: scripts/ci-test.sh

  testflight:
    runs-on: macos-26
    needs: test
    # Skipped rather than failed until the signing secrets exist; see docs/releasing.md.
    if: github.ref == 'refs/heads/main' && vars.APPLE_TEAM_ID != ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install toolchain
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3

      - name: Use the newest Xcode on the runner
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"

      # Automatic signing archives with an Apple Development identity, and a runner has none, so Xcode had Apple issue
      # a new certificate on every run until the account reached its limit and archiving failed. One certificate,
      # shared with koan's CI and kept in 1Password as "Apple Development certificate for CI", is imported instead.
      - name: Import the Apple Development certificate
        env:
          IOS_CERTIFICATE_P12: ${{ secrets.IOS_CERTIFICATE_P12 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
        if: env.IOS_CERTIFICATE_P12 != ''
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password=$(openssl rand -hex 24)
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          printf '%s' "$IOS_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$IOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$keychain" | grep -q "Apple Development" \
            || { echo "::error::no Apple Development identity in IOS_CERTIFICATE_P12"; exit 1; }

      # Signing is Xcode's cloud-managed kind, authenticated with an App Store Connect API key; the imported
      # development identity above is the only signing material kept in secrets.
      - name: Archive and upload
        env:
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY: ${{ secrets.ASC_KEY }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: scripts/testflight.sh

      # What testers see when they install the build: this version's changelog section, or Unreleased. Waits for
      # processing. The build is already uploaded, so a failure here does not fail the run.
      - name: Set What to Test
        continue-on-error: true
        env:
          ASC_KEY: ${{ secrets.ASC_KEY }}
        run: scripts/app-store.py whats-new $((1000 + ${{ github.run_number }}))
