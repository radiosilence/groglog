name: iOS

# The account's macOS runners are few and shared with every other repository, so each run takes at most one. A pull
# request runs the app's tests on macOS only when it changes something the app is built from; the changelog and the
# shared core are checked on Linux every time. A push to main is archived, signed and uploaded to TestFlight without
# running the app's tests again, since its pull request ran them, and the archive still compiles everything. Submitting
# a build for App Store review is left to App Store Connect, where the release notes and screenshots live.

permissions:
  contents: read

on:
  push:
    branches: [main]
    paths-ignore:
      - "site/**"
      - ".github/workflows/site.yml"
      - "android/**"
      - ".github/workflows/android.yml"
      - "scripts/play.py"
      - "docs/**"
      - "**.md"
  pull_request:

concurrency:
  group: ios-${{ github.ref }}
  # A newer push supersedes a TestFlight upload that hasn't finished; on a PR it only saves runner time.
  cancel-in-progress: true

jobs:
  # Whether a pull request changes anything the iOS app is built or tested from. Everything counts unless it is listed
  # here as belonging to Android, the site, the docs or release tooling, so a new path takes the macOS runner until it
  # is listed. The checkout of a pull request is its merge commit, whose first parent is the base branch. A release
  # pull request, one that raises MARKETING_VERSION, also archives the app unsigned, so a release build that fails is
  # found before the version merges rather than by the TestFlight upload after it.
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      apple: ${{ steps.diff.outputs.apple }}
      release: ${{ steps.diff.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - id: diff
        run: |
          files=$(git diff --name-only HEAD^1 HEAD | grep -vE \
            -e '^(site|android|docs|changelog\.d|\.claude)/' \
            -e '\.md$' \
            -e '^\.github/workflows/(android|site|release|cancel-closed-pr)\.yml$' \
            -e '^scripts/(play|changelog|test_changelog)\.py$' \
            -e '^scripts/(release|android-upload-key|play-service-account)\.sh$' || true)
          if [ -n "$files" ]; then
            printf 'Runs the iOS tests for:\n%s\n' "$files"
            echo "apple=true" >> "$GITHUB_OUTPUT"
          else
            echo "Nothing the iOS app is built from changed, so its tests are skipped"
            echo "apple=false" >> "$GITHUB_OUTPUT"
          fi
          if git diff HEAD^1 HEAD -- project.yml | grep -qE '^\+ *MARKETING_VERSION:'; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  # Platform-independent, so on Linux, on every run.
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      # rust-toolchain.toml's channel without its iOS and Android targets, which nothing here builds for.
      - name: Rust toolchain
        id: toolchain
        run: |
          channel=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)
          rustup toolchain install "$channel" --profile minimal --component clippy
          echo "RUSTUP_TOOLCHAIN=$channel" >> "$GITHUB_ENV"

      # CHANGELOG.md is generated from changelog.d/ and changes only in a release PR, so a PR adds fragments without
      # regenerating it. Only its fragments and the released versions are checked; one that writes the file must write
      # exactly what the fragments make.
      - name: Changelog
        if: ${{ !cancelled() }}
        env:
          EVENT: ${{ github.event_name }}
        run: |
          python3 -m unittest scripts/test_changelog.py
          if [ "$EVENT" = "pull_request" ] && git diff --name-only HEAD^1 HEAD | grep -qx CHANGELOG.md; then
            python3 scripts/changelog.py --check
          fi
          python3 scripts/changelog.py --lint

      # The shared core's own suite, which both apps rely on; the app suites exercise it only through the bindings. Each
      # check runs whatever the others found, so one failure does not hide another.
      - name: Core tests
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        run: cargo test --locked -p groglog-core

      - name: Core clippy
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        run: cargo clippy --locked -p groglog-core --all-targets -- -D warnings

  test:
    needs: changes
    if: needs.changes.outputs.apple == 'true'
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install toolchain
        id: tools
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          # cargo-ndk is for the Android build.
          install_args: just uv xcodegen

      # rust-toolchain.toml's channel with only the two iOS targets, not the Android ones the file also lists.
      - name: Rust toolchain
        id: rust
        run: |
          channel=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)
          rustup toolchain install "$channel" --profile minimal --target aarch64-apple-ios --target aarch64-apple-ios-sim
          echo "RUSTUP_TOOLCHAIN=$channel" >> "$GITHUB_ENV"

      - name: Use the newest Xcode on the runner
        id: xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"

      - name: Test
        run: scripts/ci-test.sh

      # The archive the TestFlight upload makes, without signing, which needs secrets a pull request does not get. Runs
      # whether or not the tests passed, so a failure in either does not hide the other.
      - name: Archive unsigned
        if: ${{ !cancelled() && needs.changes.outputs.release == 'true' && steps.tools.outcome == 'success' && steps.rust.outcome == 'success' && steps.xcode.outcome == 'success' }}
        run: |
          scripts/core-apple.sh
          xcodegen generate --quiet
          xcodebuild archive -scheme GrogLog -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/GrogLog.xcarchive" CODE_SIGNING_ALLOWED=NO -quiet

  testflight:
    runs-on: macos-26
    # The core and changelog checks gate the upload; the app's tests ran on its pull request.
    needs: checks
    # Fails rather than skips when a signing secret is missing, so a push to main never passes without uploading.
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install toolchain
        id: tools
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          # cargo-ndk is for the Android build.
          install_args: just uv xcodegen

      # rust-toolchain.toml's channel with only the two iOS targets, not the Android ones the file also lists.
      - name: Rust toolchain
        id: rust
        run: |
          channel=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)
          rustup toolchain install "$channel" --profile minimal --target aarch64-apple-ios --target aarch64-apple-ios-sim
          echo "RUSTUP_TOOLCHAIN=$channel" >> "$GITHUB_ENV"

      - name: Use the newest Xcode on the runner
        id: xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"

      # Automatic signing archives with an Apple Development identity, and a runner has none, so Xcode had Apple issue
      # a new certificate on every run until the account reached its limit and archiving failed. One certificate,
      # shared with koan's CI and kept in 1Password as "Apple Development certificate for CI", is imported instead.
      - name: Import the Apple Development certificate
        env:
          IOS_CERTIFICATE_P12: ${{ secrets.IOS_CERTIFICATE_P12 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
        run: |
          [ -n "$IOS_CERTIFICATE_P12" ] || { echo "::error::IOS_CERTIFICATE_P12 is not set; see docs/releasing.md"; exit 1; }
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password=$(openssl rand -hex 24)
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          printf '%s' "$IOS_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$IOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$keychain" | grep -q "Apple Development" \
            || { echo "::error::no Apple Development identity in IOS_CERTIFICATE_P12"; exit 1; }

      # Signing is Xcode's cloud-managed kind, authenticated with an App Store Connect API key; the imported
      # development identity above is the only signing material kept in secrets.
      - name: Archive and upload
        env:
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY: ${{ secrets.ASC_KEY }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: scripts/testflight.sh

      # What testers see when they install the build: this version's changelog section, or Unreleased. Waits for
      # processing. The build is already uploaded, so a failure here does not fail the run.
      - name: Set What to Test
        continue-on-error: true
        env:
          ASC_KEY: ${{ secrets.ASC_KEY }}
        run: scripts/app-store.py whats-new $((1000 + ${{ github.run_number }}))
