name: Android

# Tests and bundles the Android app on every push and pull request that touches it; on main, the bundle is signed with
# the upload key and released to Play's internal track. Promotion to the closed test and production is done by hand;
# see docs/releasing.md. A push to main whose MARKETING_VERSION has no GitHub release yet builds the signed APK, tags the
# commit that raised the version and publishes the release with the changelog section as its notes. Publishing a release
# by hand attaches the APK to it too; running the workflow by hand builds and signs the APK without publishing, to check
# that a release would work.

permissions:
  contents: read

on:
  workflow_dispatch:
  release:
    types: [published]
  push:
    branches: [main]
    paths:
      - "android/**"
      - "project.yml"
      - "scripts/play.py"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - "project.yml"
      - "scripts/play.py"
      - ".github/workflows/android.yml"

concurrency:
  # A manual run has a group of its own, so it neither cancels a push's upload nor is cancelled by one.
  group: android-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && 'manual' || 'ci' }}
  # A newer push supersedes an upload that hasn't finished; on a PR it only saves runner time.
  cancel-in-progress: true

jobs:
  # Whether the version in project.yml is newer than the latest release, and the commit that raised it. Comparing with
  # the releases rather than with the previous commit means a release that failed is made by the next push, and a push
  # that lands while one is being made finds it already out, because releases are made one at a time.
  version:
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      version: ${{ steps.check.outputs.version }}
      sha: ${{ steps.check.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != push ]; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          version=$(sed -n 's/^ *MARKETING_VERSION: *\(.*\)$/\1/p' project.yml | head -1)
          [ -n "$version" ] || { echo "::error::no MARKETING_VERSION in project.yml"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          latest=$(gh release list --limit 100 --json tagName,isDraft -q '.[] | select(.isDraft | not) | .tagName' | sed 's/^v//' | sort -V | tail -1)
          newest=$(printf '%s\n%s\n' "${latest:-0.0.0}" "$version" | sort -V | tail -1)
          if [ "$version" != "$latest" ] && [ "$newest" = "$version" ]; then
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "sha=$(git log -1 --format=%H -G"MARKETING_VERSION: ${version}\$" -- project.yml)" >> "$GITHUB_OUTPUT"
          else
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    if: github.event_name != 'release' && github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Play refuses a version code it has seen, so each run's must be higher than the last, and a re-run, which
      # uploads again, needs its own: the run number times 100, plus the attempt.
      - name: Version code
        run: echo "VERSION_CODE=$((GITHUB_RUN_NUMBER * 100 + GITHUB_RUN_ATTEMPT))" >> "$GITHUB_ENV"

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      # Only on main, and only once the secrets exist: without them the bundle is built unsigned, which tests that it
      # builds and can't be uploaded.
      - name: Upload key
        if: github.ref == 'refs/heads/main'
        env:
          ANDROID_UPLOAD_KEYSTORE: ${{ secrets.ANDROID_UPLOAD_KEYSTORE }}
        run: |
          if [ -z "$ANDROID_UPLOAD_KEYSTORE" ]; then
            echo "::notice::ANDROID_UPLOAD_KEYSTORE is not set, so the bundle is unsigned and not uploaded"
            exit 0
          fi
          printf '%s' "$ANDROID_UPLOAD_KEYSTORE" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          echo "ANDROID_UPLOAD_KEYSTORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      # The key's passwords reach the build only on main, as the key itself does: a branch's code never sees them.
      - name: Test and bundle
        env:
          ANDROID_UPLOAD_KEYSTORE_PASSWORD: ${{ github.ref == 'refs/heads/main' && secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD || '' }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ github.ref == 'refs/heads/main' && secrets.ANDROID_UPLOAD_KEY_ALIAS || '' }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ github.ref == 'refs/heads/main' && secrets.ANDROID_UPLOAD_KEY_PASSWORD || '' }}
        run: ./gradlew :app:testDebugUnitTest :app:bundleRelease -PversionCode="$VERSION_CODE"

      - name: Remove the upload key
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bundle
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 14

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        if: env.ANDROID_UPLOAD_KEYSTORE_FILE != ''

      - name: Release to the internal track
        if: env.ANDROID_UPLOAD_KEYSTORE_FILE != ''
        working-directory: .
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$PLAY_SERVICE_ACCOUNT_JSON" ]; then
            echo "::notice::PLAY_SERVICE_ACCOUNT_JSON is not set, so the signed bundle was not uploaded"
            exit 0
          fi
          scripts/play.py upload android/app/build/outputs/bundle/release/app-release.aab internal

  # The APK is signed with the upload key, not the key Play signs its own installs with, so it installs fresh but does
  # not update over a Play install, or the other way round.
  apk:
    needs: [version, build]
    # A push releases only after its tests pass; build is skipped for the other events.
    if: ${{ !cancelled() && (github.event_name == 'release' || github.event_name == 'workflow_dispatch' || (needs.build.result == 'success' && needs.version.outputs.should_release == 'true')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # One release at a time, so a second push waits and then finds the release made.
    concurrency:
      group: android-release
      cancel-in-progress: false
    defaults:
      run:
        working-directory: android
    steps:
      # The commit that raised the version, which is what the tag will name, rather than whatever main has reached.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.sha || github.sha }}

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Build the signed APK
        env:
          ANDROID_UPLOAD_KEYSTORE: ${{ secrets.ANDROID_UPLOAD_KEYSTORE }}
          ANDROID_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_UPLOAD_KEYSTORE" ]; then
            echo "::error::ANDROID_UPLOAD_KEYSTORE is not set, and an unsigned APK cannot be installed"
            exit 1
          fi
          printf '%s' "$ANDROID_UPLOAD_KEYSTORE" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          export ANDROID_UPLOAD_KEYSTORE_FILE="$RUNNER_TEMP/upload.jks"
          ./gradlew :app:assembleRelease -PversionCode="$((GITHUB_RUN_NUMBER * 100 + GITHUB_RUN_ATTEMPT))"
          name="GrogLog-${{ github.event.release.tag_name || (needs.version.outputs.should_release == 'true' && format('v{0}', needs.version.outputs.version)) || github.sha }}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/$name"
          echo "APK=$RUNNER_TEMP/$name" >> "$GITHUB_ENV"

      - name: Remove the upload key
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"

      # What a release would ship: the certificate it is signed with, which is the upload key's, and its version.
      - name: Check the APK
        run: |
          tools=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$tools/apksigner" verify --print-certs "$APK" | grep -E "certificate (DN|SHA-256)"
          "$tools/aapt2" dump badging "$APK" | grep -E "^package:"

      - name: Publish the release
        if: github.event_name == 'push'
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          notes=$(awk -v h="## $VERSION" '$0==h{f=1;next} f&&/^## /{exit} f' CHANGELOG.md)
          [ -n "$notes" ] || { echo "::error::CHANGELOG.md has no section for $VERSION"; exit 1; }
          gh release create "v$VERSION" "$APK" --target "$(git rev-parse HEAD)" --title "v$VERSION" --notes "$notes"

      - name: Attach to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" "$APK" --clobber

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: github.event_name == 'workflow_dispatch'
        with:
          name: apk
          path: ${{ env.APK }}
          retention-days: 7
